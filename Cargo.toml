[package]
name = "octri-monitoring"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "Standalone application monitoring and error reporting for Rust"
license = "MIT"
homepage = "https://octri.dev"
repository = "https://github.com/octridev/octri-rust"
documentation = "https://docs.octri.dev/docs"
readme = "README.md"
keywords = ["monitoring", "observability", "error-tracking", "octri", "apm"]
categories = ["development-tools::debugging", "web-programming"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
serde = "1"
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
